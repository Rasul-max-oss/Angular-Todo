<router-outlet>
<div class="app-container" [class.dark-theme]="isDarkTheme">
  <main class="todo-container">
    <h1 class="title">TODO LIST</h1>
    
    <div class="input-section">
      <div class="task-input-container">
        <input 
          [formControl]="task_value" 
          placeholder="Task" 
          class="task-input"
          (keyup.enter)="addTask()">
      </div>
      
      <div class="selectTask">
        <span>All</span>
        <svg class="dropdown-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      
      <div class="changeTheme" (click)="toggleTheme()" [title]="isDarkTheme ? 'Включить светлую тему' : 'Включить темную тему'">
        <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </div>
    </div>

    <ng-container *ngIf="tasks.length > 0; else emptyState">
      <ul class="task-list">
        <li *ngFor="let task of tasks; let i = index">
          <div class="task-info">
            <input 
              type="checkbox" 
              class="task-checkbox"
              (change)="task.completed = !task.completed"
              [checked]="task.completed">
            
            <span 
              class="task-title"
              [class.completed]="task.completed">
              {{ task.title }}
            </span>
          </div>
          
          <div class="task-actions">
            <button 
              class="edit-btn" 
              (click)="openEditModal(i)"
              title="Редактировать">
              <svg class="edit-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            
            <button 
              class="delete-icon-btn" 
              (click)="deleteTask(i)" 
              title="Удалить">
              <svg class="delete-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
        </li>
      </ul>
    </ng-container>

    <button class="add-btn" (click)="addTask()" aria-label="Добавить задачу">
      <svg class="add-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </main>
</div>

<ng-template #emptyState>
  <div class="empty-state">
    <div class="empty-image-container">
      <img 
        src="assets/images/detective-check.png" 
        alt="Нет задач" 
        class="empty-image"
      >
    </div>
    <p class="empty-message">Пока нет задач. Добавьте первую!</p>
  </div>
</ng-template>
</router-outlet>

<!-- Модальное окно для редактирования - ВЫНЕСЕНО ЗА ПРЕДЕЛЫ ОСНОВНОГО КОНТЕЙНЕРА -->
<div *ngIf="showEditModal" class="modal-overlay">
  <div class="modal-content" [class.dark-theme]="isDarkTheme">
    <div class="modal-header">
      <h2 class="modal-title">Редактировать задачу</h2>
      <button class="modal-close-btn" title="Закрыть" (click)="closeEditModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="modal-input-container">
        <input 
          type="text" 
          [(ngModel)]="editTaskTitle" 
          placeholder="Введите новое название задачи"
          class="modal-input"
        >
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" (click)="closeEditModal()">
        CANCEL
      </button>
      <button class="modal-btn modal-btn-save" (click)="saveTask()">
        APPLY
      </button>
    </div>
  </div>
</div>
